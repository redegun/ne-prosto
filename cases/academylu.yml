notes: 'metric: null. Относительной цифры нет.

  Academylu - услуги ландшафта (не обучение), по памяти клиента. Число подуслуг ''десятки'' - по портфолио 110+ страниц, точный счёт не сверял (36 по плану + 7 + 3 + новые).

  Новый кейс на ne-prosto уже есть и охватывает сайт на Astro, блог (77 статей), услуги, отзывы, мега-меню.

  Не включено: чистка репо/дисков, вынос media, сбои автопилота.

