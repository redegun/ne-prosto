notes: 'В портфолио уже есть кейс /portfolio/vinyl-tm: «Марки», 46 городов, каталог 580+ работ, график органики. Здесь они намеренно НЕ повторены (марки/города/каталог работ).

  Rix-круг vinyl-tm: внедрён 1 из 7 правок, эффект «без заметной разницы», в результат не брали.

  Не включено: калькулятор calc.vinyl-tm.ru (по памяти менеджеры им не пользуются, судьба не решена), групповой отчёт «Винил», анализ звонков (внутренние выводы по менеджерам клиента), деньги/ROMI/выручка (абсолютные, выводы потом пересмотрены), инциденты (авария БД, SSL, смена IP), PHP 8.3, Fatal-ошибки.

  Сомнительно: «Мегаменю» (05.2026) — по памяти решение «вариант A» принято, факт внедрения меню в живом сайте я не проверял; «Безоскол» результата без цифр нет. Перед публикацией сверить с живым сайтом.

  Дашборд сквозной аналитики закрытый, ссылка на него в публичный текст не идёт.

  Уточнение Антона 09.11 (#1882): круги Rix — доводка нашей же вёрстки, мини-кейсы из них убраны.'
