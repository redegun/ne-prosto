notes: "Материал большой (9 мини-кейсов). Метрика (-60% веса) корректна как относительная и подтверждена Lighthouse; общий эффект на трафик не измерен: Rix-замер \"мало данных\".\nНе включены: PHP 8.3 (#439), падения автопилота (#606, #1735), чистка бэкапов.\nСомнительно: отчёт клиенту \"не отправлялся\" (по логу), поэтому reports-кейс можно убрать. Объёмы \"24 новых / 20 переработанных\" взяты из отчёта за 11.10-05.11; общий счёт статей на сайте в источниках неоднозначный.\nNDA: клиент B2B-энтерпрайз, имена заказчиков не публиковать (в yml не указаны).\nХватает на новый кейс: да.\n\n  Круги Rix (7 правок дизайна, вес главной 10,2 -> 4,0 МБ) убраны по правилу Антона: доводку нашего же дизайна в кейсы не включаем."
