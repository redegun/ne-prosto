notes: 'На ne-prosto уже есть кейс /portfolio/firmaflis (перенос на MODX, каталог с фильтрами и поиском, 92 описания, техническое SEO). Фильтры и каталог в кейсе упомянуты, но свежая переделка (11 подборок, скорость) в нём нет. Сверить, чтобы не дублировать «каталог с фильтрами».

  Метрика: нет честной относительной цифры по трафику/заявкам. Скорость раздела — серверный замер. Rix-круг: «без заметной разницы», в результат не брали.

  Не включено: рамочный договор и цены (абсолютные), реквизиты, PHP 8.1→8.3, бэкапы, жалоба на кривой телефон в заявках (#869), статья не вышла (#1734, #1740 — мобильное переполнение статей, ошибка).

  Блог: «20 → 40+» собрано из журнала (20 на 31.08, 40 на 03.09, ещё 44 в аудите), точное число сейчас не проверялось.

  Комикс (ВК) — единичная акция, возможно, не для портфолио.

  Уточнение Антона 09.11 (#1882): круги Rix — доводка нашей же вёрстки, мини-кейсы из них убраны.'
