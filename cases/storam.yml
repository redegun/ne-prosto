notes: 'На ne-prosto есть кейс /portfolio/storam (сайт на MODX, 145 товаров, 11 лендингов услуг). Мини-кейсы расширяют его свежими разделами и контентом.

  Метрика: метрика карточки — по Keys.so (запросы в топе), не визиты. Визиты из Метрики в отчёте клиенту указаны без фильтра ботов (окт 1230 орг. против 532 в сен), в метрику не брала. Rix-круг: эффект «мало данных».

  В Вебмастере цифра сентября 8 972 показов позже уточнена до 18 072 (выборка top-500), если использовать показы — брать только последний отчёт.

  Не включено: PHP 8.2.35, антиспам, SSL, жалоба на «поиск из access-логов недостоверен», пропуски автопилота (#955 мобильный QA вёрстки статьи, 1665), абсолютные деньги заказов в CRM.

  CRM: «Twenty» не называется в тексте. Заказы и суммы из отчёта клиента (5 заказов на сумму) не использованы.

  Количество «хаб + 16» взято из отчёта 02.11: 5+... волна 2 «ждёт Артёма», подстраницы на сегодня стоит сверить с живым сайтом.

  Уточнение Антона 09.11 (#1882): круги Rix — доводка нашей же вёрстки, мини-кейсы из них убраны.'
