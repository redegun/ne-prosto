notes: 'Материал: 6 мини-кейсов, результатов в цифрах нет (GSC по страницам показывал 0-3 клика до переработки, после - не измерено; контроль каннибализации 13.08 в логе без итога).

  Не включены: PHP 8.3, уборка ok_tmp-скриптов (внутренняя кухня), падения автопилота (#1454, #1737).

  Важно: в плане переупаковки в источнике есть вопросы про Винил (родственный проект) - не упоминать. Магнитные наклейки клиент не делает - не упоминать.

  Хватает на новый кейс: частично (много работ SEO/контента, но нет результата; нужен замер GSC/Метрики за 2-3 месяца после переработки).

  Шаблон Merci в путях CSS - не путаница, просто общий шаблон.'
