notes: 'metric: null. На ne-prosto уже стоят абсолютные цифры, они в кейс не берутся. Честная относительная: органика +2% период к периоду, +4% год к году (26.09–03.11) - слабая, не для карточки.

  Количество «936 страниц» - число сделанного студией, можно. Статьи кормового кокона в журнале считают как 7, хищников 5, по Rix 7 новых в ноябре - расхождения учёта, число 12 из сводного отчёта 03.11.

  Кокон хищников: по логу 25.10-06.11 навигатор + цапля, норка, выдра, ондатра/бобр, лягушки, пиявки (6 статей); 09.11 начат следующий кокон (прыжки рыбы).

  Не взято: сводные отчёты клиенту (внутреннее), уборка webroot, удаление бэкапов.

  Уточнение Антона 09.11 (#1882): круги Rix — доводка нашей же вёрстки, мини-кейсы из них убраны.'
