notes: 'На ne-prosto есть кейс /portfolio/ruize (SEO-коконы, региональные и сервисные страницы, десятки статей). «Региональные страницы» в портфолио упомянуты, но по памяти гео-SEO это только план («принят, не начат», 26.07) — расхождение, проверить на живом сайте.

  Метрика: ничего относительного в источниках нет (Метрика по органике в логе не зафиксирована). Rix у ruize не запускался.

  Не включено: PHP 8.3, правки фактических ошибок RKH (#209, #223, #558 — ошибки в статьях), AjaxForm пустой POST (#500, баг), «статья не вышла», дубли пакетов, 20 агентских PHP в webroot (безопасность), документация расходится (PUBLISHING.md vs факт — issue #7).

  Количество «более 70 статей» — минимум по реестру коконов (79 без «Бумажных стаканов»); живой sitemap 277 URL на 01.11.

  ruize-author и ruize-v2 — слабые, можно убрать из публичного блока.'
