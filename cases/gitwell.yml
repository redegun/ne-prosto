notes: 'Кейс на ne-prosto (/portfolio/gitwell) короткий: автопилот, каталог, ЛК. Мини-кейсы расширяют его.

  Метрика: честной относительной цифры нет. Органика 761 → 2148 визитов в журнале считана на периодах разной длины (14 и 28 дней), поэтому не годится; плюс подозрение клиента на накрутку ПФ. Rix-круг: эффект «без заметной разницы».

  gitwell-video: ролик «как у vinyl-tm», результат качественный; видео не входит в категорию «заметный эффект», можно убрать.

  Не включено: Elasticsearch/OOM, парсеры, PDF-КП (правки 06.2026, мало данных), AI-подборщик n8n (выключен 30.09), инциденты crontab, PHP 8.3, удаление бэкапов, статьи «не вышла».

  «Орёл» работает в режиме подтверждения менеджером; можно проверить, снят ли DRY_RUN, прежде чем писать «отвечает».

  Уточнение Антона 09.11 (#1882): круги Rix — доводка нашей же вёрстки, мини-кейсы из них убраны.'
