notes: 'metric: null: честной относительной цифры нет (в источниках только абсолютные визиты).

  Автопилот блога с 25.10 вышел 1 статьёй (по rix), дальше публикация заблокирована проблемами FTP и банов хостинга (кухня). Поэтому в кейсе blog ''публикация идёт регулярно'' - спорно, стоит убрать эту фразу или заменить на ''выпустили 16 статей''. Рекомендую поправить result: «16 статей по рубрикам и перелинковка с услугами».

  Прайс и цены опущены. Фото портфолио - факт из лога, без деталей.

  Портфолио-кейс на ne-prosto уже говорит про услуги, ленту VK, скорость, спам, Telegram - все наши мини-кейсы пересекаются с ним.

