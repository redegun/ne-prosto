notes: "Материал: 7 мини-кейсов; Rix-эффект по правкам от 08.11 ещё не вычислен (мало данных), поэтому в result только факт внедрения.\nМетрика +34% — это показы в Вебмастере за два соседних периода, отчёт честно не называет это причинным; на сайт — только с формулировкой «показы», не «трафик».\nНе включены: PHP 8.3, чистка /api/, согласование цен/обещаний (+20% на цены — цены клиента, нельзя), бэкапы.\nХватает на новый кейс: да (объём и разнообразие), но сильной цифры результата нет — это сайт с рабочим SEO, где заявки пока 0 в органике.\nРегионы: в тексте кейса не приписывать географию работам портфолио (правило клиента).\n\n  Круг Rix 07.11 (8 правок дизайна) убран по правилу Антона; до/после убраны и с кейса портфолио."
