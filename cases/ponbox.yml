notes: 'Папка clients/ponbox есть (кроме orch/done.json: только #451 про CVE, это не кейс). Материал большой: 6 мини-кейсов, август-октябрь 2026.

  Осторожно: ниша инвестиционная/франшиза, юристы ограничили подачу (расчётная оценка, без гарантий). Абсолютные числа партнёра, цены, доходность и выручка автоматов в yml НЕ вставлены намеренно.

  Метрика ×2 подтверждена Метрикой, но выборка малая (23 и 47 визитов); считать её можно только как "поисковых визитов вдвое больше за 2 месяца".

  Нет страницы /portfolio/ponbox; в Rix-журнале записей по ponbox нет.

  Хватает на новый кейс: да (сайт + контент + SEO + CRM + аналитика), результата в заявках мало (2 поисковых визита с заявкой за месяц).

  Не включены: утечка vendista-api (безопасность), сброс пароля, PHP/CVE.

  Название оператора и ФИО директора не публиковать.'
