notes: 'metric: null. Расхождение с портфолио: на ne-prosto сказано ''WordPress магазин'', а с 05.11.2026 сайт на MODX; текст кейса стоит обновить.

  Все этапы миграции прошли, но реальный тестовый заказ (ПВЗ, промокод, оплата) на момент записи ждал Антона - в кейсе сказано только про проверенное.

  Автопилот статей на MODX работает через API черновиков; рабочая публикация - владелец (Юлия). Это ''Не публикуются без утверждения'': в тексте ''черновиком на проверку''.

  Часть журнала правок rix лента boemi: ''ретро-сверка статей'' (21.10) - исправление фактов в опубликованных статьях; не включал, можно добавить в кейс блога.

  Цены доставки не писал (абсолютные).'
