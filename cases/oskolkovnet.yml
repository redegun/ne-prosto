  title: Telegram-бот расчёта защитной плёнки для остекления
  task: Клиенты продают плёнку рулонами и считают заказ вручную; нужно, чтобы покупатель сам получал расчёт и оставлял заявку.
  done: Сделали бота, который считает площадь заказа, подбирает рулоны с округлением вверх, учитывает швы и стыки, показывает карточки плёнок разной толщины и принимает заявку. Добавили предзаказ через менеджера для позиций не в наличии и инструкции по замеру и монтажу.
  result: Покупатель получает расчёт и отправляет заявку в боте без звонка менеджеру.
