<!DOCTYPE html>
<html lang="ru" prefix="og: http://ogp.me/ns# fb: http://ogp.me/ns/fb#">
[[$head_2019]]

<body class="np-site np-template-6 contacts-page">

[[$np_header]]
<main id="np-main">

<div class="contacts">
		<div class="contacts-wrapper">
			<h1 class="title-main">[[*longtitle:empty=`[[*pagetitle]]`]]</h1>
			<div class="title-divider"><span class="title-divider__text">[[*introtext]]</span></div>
			<div class="contacts-items">
				<div class="contacts-item">
					<div class="contacts-item__img">
						<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40.4 58.5" class="ico-svg ico-cup-svg">
							<g>
								<path d="M37.4 28.4c-1.7-1.4-4.1-1.7-7-1l.6-6.8-2-.1-3 36.1H5.1l-3-35H24v-1.9H0l3.4 38.9h24.4l.8-9.3h.6c6.5 0 10.5-3.8 11.1-10.8.2-2.8.2-7.7-2.9-10.1zm1 9.8c-.6 6.2-3.8 9.2-9.6 9l1.5-17.8c2.6-.8 4.7-.7 6 .4 1.6 1.5 2.4 4.5 2.1 8.4zM13.1 15.4l1.2-1.5c-1.7-1.4-1.9-3.9-.5-5.6 1-1.2 1.5-2.7 1.4-4.3-.1-1.6-.9-3-2.1-4L12 1.5c.8.7 1.3 1.6 1.4 2.7.1 1.1-.2 2.1-.9 2.9-2.1 2.5-1.8 6.2.6 8.3zM18.7 16l1.2-1.5c-1-.8-1.1-2.3-.3-3.2.7-.9 1.1-2 1-3.1-.1-1.1-.6-2.1-1.5-2.9l-1.2 1.5c.5.4.7.9.8 1.6.1.6-.1 1.2-.5 1.7-1.5 1.7-1.3 4.4.5 5.9z" />
							</g>
						</svg>
					</div>
					<div class="contacts-address">
						<span class="contacts-address__text">[[++address]]</span>
						<span class="contacts-address__text">C 11:00 до 20:00, кроме выходных</span>
					</div>
				</div>
				<div class="contacts-item">
					<div class="contacts-item__img">
						<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 28.5 48" class="ico-svg ico-phone-svg">
							<g>
								<path d="M10.7 4.3h7v2h-7z" />
								<path d="M26 0H2.5C1.1 0 0 1.1 0 2.5v43C0 46.9 1.1 48 2.5 48h18.8v-2H2.5c-.3 0-.5-.2-.5-.5v-43c0-.3.2-.5.5-.5H26c.3 0 .5.2.5.5v43h2v-43C28.5 1.1 27.3 0 26 0z" />
								<path d="M14.2 44.3c2 0 3.6-1.6 3.6-3.5 0-2-1.6-3.5-3.6-3.5s-3.6 1.6-3.6 3.5c.1 1.9 1.7 3.5 3.6 3.5zm0-5.1c.9 0 1.6.7 1.6 1.6 0 .9-.7 1.6-1.6 1.6-.9 0-1.6-.7-1.6-1.6 0-.9.7-1.6 1.6-1.6z" />
							</g>
						</svg>
					</div>
					<span class="contacts-phone">[[++phone]]</span>
				</div>
				<a href="mailto:[[++e-mail]]" class="contacts-item contacts-item_mail">
					<div class="contacts-item__img">
						<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 37.5 30" class="ico-svg ico-mail-svg">
							<path d="M9.9 0H7.6v2h26.2l-15 11.7L1.3 0H0v30h37.5V0H9.9zm25.7 28H1.9V3l16.8 13.2L35.6 3.1V28z" /></svg>
					</div>
					<span class="contacts-mail">[[++e-mail]]</span>
				</a>
			</div>
		</div>
	</div>

	<div class="map">
		<div class="map-wrapper">
			<div id="map"></div>
		</div>
	</div>

[[$request_form]]

</main>
[[$np_footer]]
[[$scripts_2019]]
</body>
</html>
