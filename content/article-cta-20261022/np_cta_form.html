<form action="" class="np-cta-form" id="[[+ctaId]]-form">
<input class="np-cta-form__hp" type="text" name="email" value="" tabindex="-1" autocomplete="off" aria-hidden="true">
<input type="hidden" name="cta" value="[[+ctaBlock]]">
<div class="np-cta-form__field"><label for="[[+ctaId]]-name">Имя</label><input type="text" id="[[+ctaId]]-name" name="name" autocomplete="name" required><span class="error_name np-cta-form__error"></span></div>
<div class="np-cta-form__field"><label for="[[+ctaId]]-contact">Телефон, почта или мессенджер</label><input type="text" id="[[+ctaId]]-contact" name="contact" autocomplete="tel" required><span class="error_contact np-cta-form__error"></span></div>
<div class="np-cta-form__field np-cta-form__field--wide"><label for="[[+ctaId]]-message">Пара слов о задаче</label><textarea id="[[+ctaId]]-message" name="message" rows="3"></textarea></div>
<button type="submit" name="send" value="1" class="np-cta-form__submit">Отправить</button>
</form>
