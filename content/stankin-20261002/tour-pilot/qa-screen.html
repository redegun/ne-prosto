<!doctype html><html lang="ru"><meta charset="utf-8"><title>Проверка большого экрана — встроенный просмотр</title><link rel="stylesheet" href="./embed.css?v=screen1"><style>body{margin:0;font:16px Arial}.st-case{max-width:1250px;margin:auto}#tour h2,#tour p{margin:24px}</style><main class="st-case"><section id="tour"><h2>Пройдите по вагонам</h2><p>Проверка встроенного просмотра при масштабе экрана 200%.</p><iframe id="qa-frame" class="st-tour-frame" title="3D-просмотр" src="./qa-screen-2x.html?embed=1&amp;profile=1" data-view="outside"></iframe><p>Выберите вагон, чтобы войти внутрь.</p></section></main><script>const section=document.querySelector('#tour'),frame=document.querySelector('iframe');function fit(){const width=Number(new URLSearchParams(location.search).get('width'))||document.documentElement.clientWidth;section.style.setProperty('--st-tour-page-width',width+'px');if(width>document.documentElement.clientWidth){frame.style.height='540px';document.querySelector('main').style.minWidth=width+'px';document.querySelector('main').style.marginLeft='0';}}fit();window.addEventListener('resize',fit);window.addEventListener('message',e=>{if(e.source===frame.contentWindow&&e.origin===location.origin&&e.data?.type==='stankin:mode')frame.dataset.view=e.data.mode==='outside'?'outside':'inside';});</script></html>
