name: Publish anonymised editorial article
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ne-prosto-stankin-deploy
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, neprosto-once]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Validate neutral public content
        run: python3 content/article-privacy-20261019/publish_ci.py --check
      - name: Back up, hide old details and publish neutral version
        env:
          NE_PROSTO_FTP: ${{ secrets.NE_PROSTO_FTP }}
        run: python3 -u content/article-privacy-20261019/publish_ci.py
