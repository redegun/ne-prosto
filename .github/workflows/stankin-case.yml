name: Publish STANKIN case
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ne-prosto-stankin-deploy
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, neprosto-once]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Validate case release
        run: python3 content/stankin-20261002/tour-pilot/tools/deploy_hero_case_ci.py --check
      - name: Publish case opening
        env:
          NE_PROSTO_FTP: ${{ secrets.NE_PROSTO_FTP }}
        run: python3 -u content/stankin-20261002/tour-pilot/tools/deploy_hero_case_ci.py
