name: Publish STANKIN tour
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ne-prosto-stankin-deploy
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, neprosto-once]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Validate release
        working-directory: content/stankin-20261002/tour-pilot
        run: |
          node --check embed.js
          node --check tour.js
          node --check appearance.js
          node --check detail-textures.js
          node --check station.js
          node --check train-overview.js
          node --check effects.js
          node --check ui-controls.js
          python3 tools/deploy_idle_ci.py --check
          python3 tools/deploy_idle_case_ci.py --check
      - name: Publish scoped controls and version case embed links
        working-directory: content/stankin-20261002/tour-pilot
        env:
          NE_PROSTO_FTP: ${{ secrets.NE_PROSTO_FTP }}
        run: |
          python3 -u tools/deploy_idle_ci.py
          python3 -u tools/deploy_idle_case_ci.py
